# Security gate for the Project 3 Terraform code (CM-3, SA-11, RA-5).
# Runs on every pull request and every push to main. It needs no Azure
# credentials: it only reads the code.
# Actions are pinned to full commit SHAs (POAM-17, SR-3): a moved or
# compromised tag cannot change what runs. Dependabot proposes updates.
name: terraform-checkov

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload Checkov results to the Security tab

env:
  TF_DIR: project-3-terraform/terraform

jobs:
  validate:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform -chdir=$TF_DIR fmt -check -recursive
      - name: Init (no backend, no Azure login)
        run: terraform -chdir=$TF_DIR init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=$TF_DIR validate

  checkov:
    name: checkov scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@d4770c1ac4a966d8c3305b79c348c26232123aa1 # v12.3146.0
        with:
          directory: project-3-terraform/terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: false # any failed check fails the pull request
      - name: Upload results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          sarif_file: results.sarif
          category: checkov
